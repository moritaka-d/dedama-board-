name: fetch dedama

on:
  schedule:
    - cron: "5 14 * * *"     # 毎日 23:05 JST（cron は UTC 表記）
  workflow_dispatch:         # 手動実行も可

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取得
        run: python3 fetch_dedama.py data

      - name: コミット
        run: |
          git config user.name "dedama-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
